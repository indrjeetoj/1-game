
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hill Climb Racing - Blue Edition</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071326;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:15px;background:#0c1e38;border-bottom:2px solid #20baff}
h1{margin:0;color:#38c7ff;font-size:27px}
header p{margin:7px 0 0;color:#b8d8f0}
.game{max-width:1000px;margin:18px auto;padding:10px}
.hud{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stat{background:#102747;padding:10px 16px;border-radius:12px;min-width:100px}
.stat span{display:block;color:#44d0ff;font-weight:bold;font-size:20px;margin-top:4px}
canvas{display:block;width:100%;height:auto;aspect-ratio:2/1;background:#8be3ff;border:2px solid #25bfff;border-radius:14px}
.controls{display:flex;justify-content:center;gap:14px;margin:15px 0}
button{border:0;border-radius:13px;background:#087ee5;color:white;padding:15px 23px;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #064b91;touch-action:none;user-select:none}
button:active{transform:translateY(3px);box-shadow:none;background:#16b7ff}
#jump{background:#7847e8;box-shadow:0 4px 0 #452292}
#restart{background:#13a77a;box-shadow:0 4px 0 #08684b}
.help{color:#bdd2e8;font-size:14px;line-height:1.8}
footer{padding:14px;color:#8ca9c8}
</style>
</head>
<body>
<header>
<h1>🏁 HILL CLIMB RACING</h1>
<p>Blue Edition • Drive, jump and collect coins!</p>
</header>

<div class="game">
<div class="hud">
<div class="stat">DISTANCE<span id="distance">0 m</span></div>
<div class="stat">🪙 COINS<span id="coins">0</span></div>
<div class="stat">⛽ FUEL<span id="fuel">100%</span></div>
<div class="stat">🏆 BEST<span id="best">0 m</span></div>
</div>

<canvas id="game" width="1000" height="500"></canvas>

<div class="controls">
<button id="brake">◀ BRAKE</button>
<button id="jump">⬆ JUMP</button>
<button id="gas">GAS ▶</button>
<button id="restart">↻ RESTART</button>
</div>

<div class="help">
Keyboard: ← / A = Brake &nbsp; | &nbsp; → / D = Accelerate
<br>Space / ↑ = Jump • Collect coins • Don't run out of fuel!
</div>
</div>
<footer>Made for gamers 💙 Keep climbing!</footer>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W=1000,H=500;

let car, camera, coins, fuelCans, particles, keys;
let totalCoins=0, fuel=100, distance=0, best=0;
let gameOver=false, won=false, lastTime=0;
let frame=0;

try { best=Number(localStorage.getItem("hillBest"))||0; } catch(e){}
document.getElementById("best").textContent=best+" m";

function terrain(x){
  return 370
    - 48*Math.sin(x/160)
    - 24*Math.sin(x/67)
    - 17*Math.sin(x/310);
}
function reset(){
  car={x:100,y:terrain(100)-35,vx:0,vy:0,angle:0,
       av:0,onGround:false};
  camera=0;
  totalCoins=0;fuel=100;distance=0;
  gameOver=false;won=false;frame=0;
  coins=[];fuelCans=[];particles=[];
  keys={gas:false,brake:false,jump:false};
  for(let x=350;x<25000;x+=230+Math.random()*170){
    coins.push({x,y:terrain(x)-65-Math.random()*40,taken:false});
  }
  for(let x=1100;x<25000;x+=1500){
    fuelCans.push({x,y:terrain(x)-55,taken:false});
  }
  updateHUD();
}
function updateHUD(){
  document.getElementById("distance").textContent=Math.max(0,Math.floor(car.x/10))+" m";
  document.getElementById("coins").textContent=totalCoins;
  document.getElementById("fuel").textContent=Math.ceil(fuel)+"%";
}
function circle(x,y,r,color){
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function line(x1,y1,x2,y2,color,width=2){
  ctx.strokeStyle=color;ctx.lineWidth=width;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function draw(){
  ctx.clearRect(0,0,W,H);

  // Sky
  let sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#42b9ff");
  sky.addColorStop(1,"#e0faff");
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // Sun
  circle(840,85,39,"#fff2a0");
  circle(840,85,31,"#fff8cc");

  // Distant hills
  for(let layer=0;layer<2;layer++){
    ctx.fillStyle=layer===0?"#7dc6b2":"#4ca98e";
    ctx.beginPath();ctx.moveTo(0,H);
    for(let sx=0;sx<=W;sx+=8){
      let wx=sx+camera*(layer===0?0.15:0.3);
      let y=310+layer*55+25*Math.sin(wx/110)+20*Math.sin(wx/53);
      ctx.lineTo(sx,y);
    }
    ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  }

  // Ground
  ctx.beginPath();ctx.moveTo(0,H);
  for(let sx=0;sx<=W+5;sx+=5){
    ctx.lineTo(sx,terrain(sx+camera));
  }
  ctx.lineTo(W,H);ctx.closePath();
  let ground=ctx.createLinearGradient(0,300,0,H);
  ground.addColorStop(0,"#35b849");ground.addColorStop(1,"#17662f");
  ctx.fillStyle=ground;ctx.fill();
  ctx.beginPath();
  for(let sx=0;sx<=W+5;sx+=5){
    const sy=terrain(sx+camera);
    if(sx===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);
  }
  ctx.strokeStyle="#b3ff70";ctx.lineWidth=5;ctx.stroke();

  // Trees
  for(let wx=Math.floor(camera/180)*180;wx<camera+W+180;wx+=180){
    const sx=wx-camera;
    const sy=terrain(wx);
    ctx.fillStyle="#704629";ctx.fillRect(sx-5,sy-46,10,46);
    circle(sx,sy-55,20,"#177e45");
    circle(sx-12,sy-46,13,"#25a852");
    circle(sx+12,sy-47,13,"#1c9344");
  }

  // Coins
  for(const c of coins){
    if(c.taken)continue;
    const sx=c.x-camera;
    if(sx < -30 || sx>W+30)continue;
    circle(sx,c.y,13,"#d88b00");
    circle(sx,c.y,10,"#ffdf35");
    ctx.fillStyle="#b77a00";ctx.font="bold 15px Arial";
    ctx.textAlign="center";ctx.fillText("$",sx,c.y+5);
  }

  // Fuel cans
  for(const f of fuelCans){
    if(f.taken)continue;
    const sx=f.x-camera;
    if(sx < -30 || sx>W+30)continue;
    ctx.fillStyle="#e53935";
    ctx.fillRect(sx-12,f.y-17,24,30);
    ctx.fillStyle="#fff";
    ctx.fillRect(sx-5,f.y-11,10,18);
    ctx.fillStyle="#e53935";
    ctx.font="bold 13px Arial";ctx.textAlign="center";
    ctx.fillText("F",sx,f.y+3);
  }

  // Car
  const sx=car.x-camera, sy=car.y;
  ctx.save();ctx.translate(sx,sy);ctx.rotate(car.angle);

  // Shadow
  ctx.fillStyle="rgba(0,0,0,.18)";
  ctx.beginPath();ctx.ellipse(0,25,48,8,0,0,Math.PI*2);ctx.fill();

  // Wheels
  for(const wx of [-29,29]){
    circle(wx,14,17,"#182536");
    circle(wx,14,10,"#9caeba");
    circle(wx,14,4,"#34465a");
    line(wx-6,14,wx+6,14,"#dce8f0",2);
    line(wx,8,wx,20,"#dce8f0",2);
  }

  // Car body
  ctx.fillStyle="#087cf0";
  ctx.beginPath();
  ctx.moveTo(-45,7);ctx.lineTo(-39,-13);
  ctx.lineTo(-18,-19);ctx.lineTo(-5,-35);
  ctx.lineTo(20,-35);ctx.lineTo(35,-15);
  ctx.lineTo(44,-10);ctx.lineTo(47,7);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle="#a4e9ff";ctx.lineWidth=2;ctx.stroke();

  // Windows
  ctx.fillStyle="#b9efff";
  ctx.beginPath();ctx.moveTo(-13,-22);ctx.lineTo(-2,-32);
  ctx.lineTo(16,-32);ctx.lineTo(25,-17);ctx.lineTo(-13,-17);
  ctx.closePath();ctx.fill();

  // Driver
  circle(2,-24,7,"#ffcf9f");
  ctx.fillStyle="#153451";ctx.fillRect(-5,-17,15,8);

  // Headlight
  circle(41,-5,4,"#fff5a3");
  ctx.restore();

  // Speed bar
  ctx.fillStyle="rgba(3,30,62,.6)";
  ctx.fillRect(18,18,180,25);
  ctx.fillStyle="#fff";ctx.font="bold 14px Arial";ctx.textAlign="left";
  ctx.fillText("SPEED",28,35);
  ctx.fillStyle="#27c4ff";ctx.fillRect(82,25,Math.min(100,Math.abs(car.vx)*12),10);

  if(gameOver){
    ctx.fillStyle="rgba(3,13,32,.78)";
    ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle=won?"#7dffb1":"#ffffff";
    ctx.font="bold 46px Arial";
    ctx.fillText(won?"🏆 YOU WIN!":"GAME OVER",W/2,H/2-25);
    ctx.fillStyle="#d7efff";ctx.font="22px Arial";
    ctx.fillText("Distance: "+Math.floor(distance)+" m   |   Coins: "+totalCoins,W/2,H/2+20);
    ctx.font="18px Arial";
    ctx.fillText("Press RESTART to play again",W/2,H/2+60);
  }
}

function update(dt){
  if(gameOver)return;
  frame++;

  const accel=keys.gas?0.22:0;
  const braking=keys.brake;
  car.vx+=accel*dt*60;
  if(braking)car.vx-=0.18*dt*60;

  // Friction and speed limits
  car.vx*=Math.pow(car.onGround?0.992:0.999,dt*60);
  car.vx=Math.max(-3,Math.min(8,car.vx));

  // Jump
  if(keys.jump&&car.onGround){
    car.vy=-7.8;car.onGround=false;
    car.av+=(Math.random()-.5)*0.025;
  }
  keys.jump=false;

  // Gravity
  car.vy+=0.28*dt*60;
  car.x+=car.vx*dt*60;
  car.y+=car.vy*dt*60;

  // Terrain and car tilt
  const ground=terrain(car.x);
  const slope=(terrain(car.x+12)-terrain(car.x-12))/24;
  const targetAngle=Math.atan(slope);
  const wheelBottom=car.y+31;

  if(wheelBottom>=ground){
    car.y=ground-31;
    car.vy=0;
    car.onGround=true;
    car.angle+=(targetAngle-car.angle)*Math.min(1,dt*12);
  }else{
    car.onGround=false;
    car.angle+=car.av*dt*60;
    car.av*=0.992;
  }

  // Keep the car within the world
  car.x=Math.max(40,car.x);
  if(car.x<100)car.vx=Math.max(0,car.vx);

  // Collect coins
  for(const c of coins){
    if(!c.taken&&Math.hypot(car.x-c.x,car.y-c.y)<38){
      c.taken=true;totalCoins++;
    }
  }
  // Refuel
  for(const f of fuelCans){
    if(!f.taken&&Math.hypot(car.x-f.x,car.y-f.y)<42){
      f.taken=true;fuel=Math.min(100,fuel+30);
    }
  }

  // Fuel consumption
  fuel-=dt*(keys.gas?1.3:0.35);
  fuel=Math.max(0,fuel);

  distance=Math.max(distance,car.x/10);
  camera=Math.max(0,car.x-250);

  // End conditions
  if(fuel<=0){gameOver=true;}
  if(car.y>H+100){gameOver=true;}
  if(Math.abs(car.angle)>2.5 && !car.onGround){
    // Allow recovery in the air, no instant crash
  }
  if(distance>2000){won=true;gameOver=true;}

  if(distance>best){
    best=Math.floor(distance);
    try{localStorage.setItem("hillBest",best);}catch(e){}
  }
  updateHUD();
  document.getElementById("best").textContent=best+" m";
}

function loop(t){
  const dt=Math.min((t-lastTime)/1000||0,0.032);
  lastTime=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// Keyboard controls
window.addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowLeft","ArrowUp"," ","ArrowDown"].includes(e.key))e.preventDefault();
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.gas=true;
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.brake=true;
  if((e.key===" "||e.key==="ArrowUp")&&!e.repeat)keys.jump=true;
});
window.addEventListener("keyup",e=>{
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.gas=false;
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.brake=false;
});

// Holdable mobile/desktop buttons
function holdButton(id,key){
  const el=document.getElementById(id);
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();keys[key]=true;
    try{el.setPointerCapture(e.pointerId)}catch(_){}
  });
  const release=e=>{keys[key]=false};
  el.addEventListener("pointerup",release);
  el.addEventListener("pointercancel",release);
  el.addEventListener("lostpointercapture",release);
}
holdButton("gas","gas");
holdButton("brake","brake");
document.getElementById("jump").addEventListener("pointerdown",e=>{
  e.preventDefault();keys.jump=true;
});
document.getElementById("restart").addEventListener("click",reset);

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
